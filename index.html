    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var nativeFetch = window.fetch ? window.fetch.bind(window) : undefined;
          if (nativeFetch) {
            try {
              Object.defineProperty(window, 'fetch', {
                configurable: true,
                enumerable: true,
                writable: true,
                value: nativeFetch,
              });
            } catch (_) {}
            try {
              if (typeof Window !== 'undefined' && Window.prototype) {
                Object.defineProperty(Window.prototype, 'fetch', {
                  configurable: true,
                  enumerable: true,
                  writable: true,
                  value: nativeFetch,
                });
              }
            } catch (_) {}
          }
        } catch (_) {}

        window.addEventListener(
          'error',
          function (event) {
            var msg = String((event && event.message) || '');
            var src = String((event && event.filename) || '');
            if (
              msg.indexOf('Cannot set property fetch') !== -1 ||
              src.indexOf('chrome-extension://') === 0 ||
              src.indexOf('moz-extension://') === 0
            ) {
              event.stopImmediatePropagation();
              event.preventDefault();
            }
          },
          true
        );
      })();
    </script>
